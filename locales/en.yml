tokens:
  renewed_one: "Token renewed for “{name}”."
  renewed_many: "{count} tokens renewed."
  all_fresh: Every token is still valid.
  failed: "Cannot renew “{name}”: {error}"

settings:
  title: Settings
  auto_switch_title: Auto-switch
  auto_switch_hint: When a meter passes its threshold, move to the next account in list order.
  start_on_freest_title: Start on the freest account
  start_on_freest_hint: At launch, switch to the account with the most week left for the days before it resets.
  autostart_title: Launch at login
  autostart_hint: The app starts on its own when you sign in, so the icon is always in the bar.
  start_hidden_title: Start in the bar
  start_hidden_hint: "On launch it does not open the window: only the icon stays up top."
  language_title: Language
  language_hint: Applies straight away, no restart needed.
  language_auto: Automatic ({name})

update:
  badge: A new version is available
  title: Update
  available: "Version {version} is available. You are on {current}."
  notes: Release notes
  install: Download and install
  install_hint: Downloads the package and installs it with the system package manager. The password prompt in the middle is the system's own — this app never sees it.
  handoff_hint: "Downloads the package and shows it to you: on this system putting it in place is a step you take yourself."
  open_page: Open the release page
  open_page_hint: This release carries no package in the format this copy was installed from, so the download is a manual one.
  working: Downloading…
  working_install: Downloading and installing…
  done: "{name} downloaded — putting it in place is yours to do."
  installed: "Version {version} installed. Quit from the tray menu and start it again to run it."
  cancelled: Installation cancelled — nothing was changed.

errors:
  no_login: no login found — run `claude` and sign in before saving
  no_terminal: no terminal emulator found — open one yourself and run `claude`
  empty_name: the name cannot be empty
  autostart: "cannot set launch at login: {error}"
  rate_limited: too many requests to the API
  no_token: no token saved for this account
  no_refresh_token: no refresh token saved for this account — sign in again with `claude`
  refresh_rejected: the refresh token was refused — sign in again with `claude`
  login_busy: Claude Code is writing its login right now
  invalid_token: invalid or expired token
  api_status: the API answered {status}
  download_truncated: the download did not arrive whole — nothing was installed
  install_failed: "the package manager exited with {status}"
  no_update: no newer version to install
  no_opener: "cannot hand the file to the desktop: {error}"
