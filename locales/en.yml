login:
  unsaved_title: Login not saved
  unsaved_body: "{name} is signed in but is not one of the saved accounts."
  unsaved_fallback: An account
  save_current: Save current login
  add: Add account
  add_title: Add an account
  step_logout: Sign out of the current account (it stays saved, you do not lose it).
  logout: Sign out
