# Italian UI strings.
#
# One file per language, shared by both halves of the app: Vite compiles it into
# the window's bundle, and the Rust side embeds it for the tray and the errors it
# raises. Placeholders are `{name}` and are substituted the same way on both
# sides, so a string can move between them without being rewritten.
#
# Adding a language: copy this file to `locales/<tag>.yml`, translate the values,
# and register the tag in `src/i18n.ts` and `src-tauri/src/i18n.rs`.

